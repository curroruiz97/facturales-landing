# Comprobaciones estáticas de la landing en cada push y pull request.
# No hay build ni dependencias: scripts/check-site.py solo usa la biblioteca estándar de Python.
name: Landing CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar el sitio (HTML, enlaces, SEO, accesibilidad y contenido veraz)
        run: python3 scripts/check-site.py
